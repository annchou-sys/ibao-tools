<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iBao 商品圖工具</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer crossorigin="anonymous"></script>
<style>
/* ===== 共用 ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:13px;background:#f8f7f5;color:#1a1a1a}

/* Tab 列 */
.tab-bar{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;padding:0 20px;height:48px;gap:0}
.tab-bar h1{font-size:13px;font-weight:600;letter-spacing:.04em;margin-right:24px;white-space:nowrap}
.tab-btn{padding:0 18px;height:48px;border:none;background:transparent;cursor:pointer;font-size:12px;color:#888;font-family:inherit;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.tab-btn.on{color:#1a1a1a;font-weight:500;border-bottom-color:#1a1a1a}
.tab-btn:hover{color:#555}
.tab-panel{display:none}
.tab-panel.on{display:block}

/* ===== v32 主圖產生器 ===== */

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:13px;background:#f5f4f0;color:#1a1a1a;padding:16px;max-width:640px;margin:0 auto}
h1{font-size:14px;font-weight:600;letter-spacing:.06em;margin-bottom:14px}
.sec{font-size:10px;font-weight:600;color:#999;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid #ccc;border-radius:7px;overflow:hidden}
.seg button{padding:5px 14px;font-size:12px;background:transparent;border:none;cursor:pointer;color:#666;font-family:inherit}
.seg button.on{background:#fff;color:#1a1a1a;font-weight:500}
.seg button:not(:last-child){border-right:1px solid #ccc}
.tb{padding:5px 14px;font-size:12px;border:1px solid #ccc;border-radius:7px;background:transparent;cursor:pointer;color:#666;font-family:inherit}
.tb.on{background:#fff;color:#1a1a1a;font-weight:500}
.card{border:1px solid #ddd;border-radius:12px;background:#fff;padding:13px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.fl{display:flex;flex-direction:column;gap:3px}
.fl label{font-size:11px;color:#666}
.fl input[type=text]{font-size:12px;border-radius:7px;border:1px solid #ddd;background:#faf9f7;color:#1a1a1a;padding:6px 9px;width:100%;font-family:inherit}
.url-row{display:flex;gap:6px}
.url-row input{flex:1;min-width:0;font-size:12px;border-radius:7px;border:1px solid #ddd;background:#faf9f7;color:#1a1a1a;padding:6px 9px;font-family:inherit}
.url-row button{flex-shrink:0;padding:6px 14px;font-size:12px;border:1px solid #ccc;border-radius:7px;background:#f0ede8;cursor:pointer;color:#1a1a1a;font-family:inherit}
.url-row button:hover{background:#e8e5e0}
.msg{font-size:11px;min-height:15px}
.ok{color:#2e7d32}.ng{color:#c0392b}
.expbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;font-size:13px;border:1px solid #ccc;border-radius:9px;background:#1a1a1a;cursor:pointer;color:#fff;width:100%;font-family:inherit;font-weight:500;margin-top:4px}
.expbtn:hover{background:#333}
.prev-canvas-wrap{width:100%;background:#fff;border:1px solid #bbb;border-radius:4px;overflow:hidden}
.slot-item{display:flex;gap:10px;align-items:flex-start;padding:10px;background:#faf9f7;border:1px solid #eee;border-radius:8px;margin-bottom:6px}
.slot-left{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:76px}
.slot-thumb{width:72px;height:60px;border-radius:5px;overflow:hidden;position:relative;background:#eee;display:flex;align-items:center;justify-content:center;font-size:10px;color:#bbb;cursor:pointer;border:1px dashed #ccc}
.slot-thumb.filled{border:1px solid #ddd}
.slot-thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.slot-lbl{font-size:10px;color:#888;font-weight:500}
.slot-upload{font-size:10px;padding:2px 0;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;color:#444;font-family:inherit;width:100%;text-align:center}
.slot-rm{font-size:10px;padding:2px 0;border:1px solid #e0a0a0;border-radius:4px;background:#fff;cursor:pointer;color:#c0392b;font-family:inherit;width:100%;text-align:center;margin-top:2px}
.slot-right{flex:1;display:flex;flex-direction:column;gap:5px}
.slr{display:flex;align-items:center;gap:5px}
.slr span.lbl{font-size:10px;color:#888;width:48px;flex-shrink:0}
.slr input[type=range]{flex:1}
.slr span.val{font-size:10px;color:#aaa;width:26px;text-align:right}



/* ===== 9格產生器 ===== */
.g9-wrap{padding:20px;max-width:760px;margin:0 auto}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft JhengHei", sans-serif; background: #f5f5f3; padding: 24px 16px; color: #222; }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: 2px; margin-bottom: 4px; }
  .subtitle { font-size: 11px; color: #888; margin-bottom: 20px; }
  .top-row { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
  .top-row label { font-size: 11px; color: #888; white-space: nowrap; }
  .top-row input { flex: 1; border: 1px solid #ddd; border-radius: 4px; padding: 7px 10px; font-size: 12px; font-family: inherit; outline: none; background: #fff; text-align: right; }
  .top-row input:focus { border-color: #b89a6a; }
  .grid-inputs { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 20px; }
  .cell { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
  .cell-num { font-size: 10px; color: #aaa; margin-bottom: 5px; }
  .preview-box { width: 100%; position: relative; padding-bottom: 100%; overflow: hidden; background: #f0f0ee; border-radius: 3px; margin-bottom: 6px; }
  .preview-box img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; }
  .preview-placeholder { position: absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#bbb; }
  .cell input { width: 100%; border: 1px solid #e0e0e0; border-radius: 3px; padding: 5px 7px; font-size: 11px; font-family: inherit; outline: none; color: #666; }
  .cell input:focus { border-color: #b89a6a; }
  .cell input.converted { border-color: #b89a6a; background: #fffbf5; }
  .actions { display: flex; gap: 8px; margin-bottom: 16px; }
  .btn { padding: 9px 20px; border: none; border-radius: 4px; font-size: 12px; font-family: inherit; cursor: pointer; letter-spacing: 1px; }
  .btn-primary { background: #1a1a1a; color: #fff; }
  .btn-primary:hover { background: #333; }
  .btn-copy { background: #fff; color: #333; border: 1px solid #ccc; }
  .btn-copy:hover { background: #f5f5f5; }
  .output-area { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .output-label { font-size: 10px; color: #888; letter-spacing: 1px; margin-bottom: 8px; }
  .output-code { font-size: 10px; color: #666; background: #f9f9f9; border-radius: 3px; padding: 8px; max-height: 120px; overflow-y: auto; word-break: break-all; white-space: pre-wrap; }
  .preview-result { margin-top: 16px; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; }
  .preview-result-label { font-size: 10px; color: #888; letter-spacing: 1px; margin-bottom: 8px; }


</style>
</head>
<body>

<div class="tab-bar">
  <h1>iBao 商品圖工具</h1>
  <button class="tab-btn on" onclick="switchTab(0,this)">主圖產生器</button>
  <button class="tab-btn" onclick="switchTab(1,this)">9宮格展示牆</button>
</div>

<!-- Tab 0: v32 主圖產生器 -->
<div class="tab-panel on" id="tab0">

<h1>iBao 商品主圖產生器</h1>

<div class="card">
  <div style="display:flex;gap:6px;align-items:center">
    <input type="text" id="fileName" placeholder="請輸入檔名（必填）" style="flex:1;font-size:14px;font-weight:500;border-radius:7px;border:1px solid #ddd;background:#faf9f7;color:#1a1a1a;padding:8px 10px;font-family:inherit">
    <span style="font-size:12px;color:#aaa;flex-shrink:0">.jpg</span>
  </div>
</div>

<div class="card">
  <div class="row">
    <span style="color:#666">版型</span>
    <div class="seg" id="gSeg">
      <button onclick="sGrid(1,this)">1格</button>
      <button class="on" onclick="sGrid(2,this)">2格</button>
      <button onclick="sGrid(3,this)">3格</button>
      <button onclick="sGrid(4,this)">4格</button>
      <button onclick="sGrid(5,this)">5格</button>
      <button onclick="sGrid(6,this)">6格</button>
    </div>
  </div>
  <div class="row" style="margin-top:4px">
    <span style="color:#666">尺寸</span>
    <button class="tb on" id="s11" onclick="sSz('1:1',this)">1:1</button>
    <button class="tb" id="s45" onclick="sSz('4:5',this)">4:5</button>
  </div>
</div>

<div class="card">
  <div style="display:flex;gap:6px;align-items:center">
    <input type="text" id="txM" placeholder="主標文案" oninput="rP()" style="flex:1;font-size:16px;font-weight:500;border-radius:7px;border:1px solid #ddd;background:#faf9f7;color:#1a1a1a;padding:8px 12px;font-family:inherit">
    <button onclick="saveTheme()" style="flex-shrink:0;padding:6px 12px;font-size:12px;border:1px solid #888;border-radius:6px;background:#1a1a1a;color:#fff;cursor:pointer;font-family:inherit">固定</button>
    <button onclick="resetTheme()" style="flex-shrink:0;padding:6px 12px;font-size:12px;border:1px solid #ccc;border-radius:6px;background:#f5f5f5;cursor:pointer;font-family:inherit">重製</button>
  </div>
  <div id="savedThemeBar" style="display:none;font-size:11px;color:#888;padding:4px 8px;background:#f5f5f5;border-radius:6px;display:flex;align-items:center;gap:8px">
    <span>已儲存：</span><span id="savedThemeLabel" style="color:#1a1a1a;font-weight:500"></span>
    <button onclick="loadTheme()" style="margin-left:auto;padding:2px 8px;font-size:10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-family:inherit">套用</button>
  </div>
<input type="text" id="txS" style="display:none">
</div>

<div class="card">
  <div class="sec">預覽</div>
  <div class="prev-canvas-wrap" id="prevWrap">
    <canvas id="prevCv" style="display:block;width:100%"></canvas>
  </div>
</div>

<div class="card">
  <div class="sec">圖片管理</div>
  <div id="slotList"></div>
<div id="slotSeg" style="display:none"></div><div id="dmsg" style="display:none"></div>
</div>





<div class="card" style="margin-top:4px">
  <div style="display:flex;gap:6px">
    <button class="expbtn" onclick="doExp('local')" style="flex:1">↓ 存到電腦</button>
    <button class="expbtn" onclick="doExp('drive')" style="flex:1;background:#4285f4;border-color:#4285f4">▲ 存到 Drive</button>
  </div>
  <div id="saveMsg" style="font-size:11px;min-height:14px;text-align:center;margin-top:4px"></div>
</div>

</div>

<!-- Tab 1: 9格產生器 -->
<div class="tab-panel" id="tab1">
  <div class="g9-wrap">

<h1>iBao 9宮格產生器</h1>

<script>
function switchTab(n, btn){
  document.querySelectorAll('.tab-panel').forEach(function(p,i){p.classList.toggle('on',i===n);});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  if(n===1 && typeof init==='function' && !window._g9init){window._g9init=true;init();}
}

/* ===== v32 JS ===== */

var gN=2, ratio='1:1', tSlot=0;
var imgs=Array(6).fill(null);
var cfg=[];
for(var i=0;i<6;i++) cfg.push({ox:0,oy:0,zoom:100,bright:100,contrast:100});

var LBLS={
  1:['圖片'],
  2:['上圖','下圖'],
  3:['大圖','小圖左','小圖右'],
  4:['大圖','小圖1','小圖2','小圖3'],
  5:['左上','左下','右上','右中','右下'],
  6:['格1','格2','格3','格4','格5','格6']
};

function nSlots(){return gN}
function getL(){return LBLS[gN]}

function getSlotRatios(){
  var bw=0.12, rw=1-bw;
  if(gN===2) return [{x:bw,y:0,w:rw,h:0.5},{x:bw,y:0.5,w:rw,h:0.5}];
  if(gN===3) return [{x:bw,y:0,w:rw,h:0.6},{x:bw,y:0.6,w:rw/2,h:0.4},{x:bw+rw/2,y:0.6,w:rw/2,h:0.4}];
  if(gN===4) return [
    {x:bw,y:0,w:rw/2,h:0.5},{x:bw+rw/2,y:0,w:rw/2,h:0.5},
    {x:bw,y:0.5,w:rw/2,h:0.5},{x:bw+rw/2,y:0.5,w:rw/2,h:0.5}
  ];
  if(gN===5) return [
    {x:bw,y:0,w:rw/2,h:0.5},{x:bw,y:0.5,w:rw/2,h:0.5},
    {x:bw+rw/2,y:0,w:rw/2,h:1/3},{x:bw+rw/2,y:1/3,w:rw/2,h:1/3},{x:bw+rw/2,y:2/3,w:rw/2,h:1/3}
  ];
  if(gN===6) return [
    {x:bw,y:0,w:rw/2,h:1/3},{x:bw+rw/2,y:0,w:rw/2,h:1/3},
    {x:bw,y:1/3,w:rw/2,h:1/3},{x:bw+rw/2,y:1/3,w:rw/2,h:1/3},
    {x:bw,y:2/3,w:rw/2,h:1/3},{x:bw+rw/2,y:2/3,w:rw/2,h:1/3}
  ];
  return [];
}

function getLineRatios(){
  var bw=0.12, rw=1-bw, L=[];
  // 1格無內部格線
  if(gN===2) L.push({x1:bw,y1:0.5,x2:1,y2:0.5});
  if(gN===3){L.push({x1:bw,y1:0.6,x2:1,y2:0.6});L.push({x1:bw+rw/2,y1:0.6,x2:bw+rw/2,y2:1});}
  if(gN===4){
    L.push({x1:bw,y1:0.5,x2:1,y2:0.5});
    L.push({x1:bw+rw/2,y1:0,x2:bw+rw/2,y2:1});
  }
  if(gN===5){
    L.push({x1:bw+rw/2,y1:0,x2:bw+rw/2,y2:1});
    L.push({x1:bw,y1:0.5,x2:bw+rw/2,y2:0.5});
    L.push({x1:bw+rw/2,y1:1/3,x2:1,y2:1/3});
    L.push({x1:bw+rw/2,y1:2/3,x2:1,y2:2/3});
  }
  if(gN===6){L.push({x1:bw+rw/2,y1:0,x2:bw+rw/2,y2:1});L.push({x1:bw,y1:1/3,x2:1,y2:1/3});L.push({x1:bw,y1:2/3,x2:1,y2:2/3});}
  return L;

// 預覽 canvas：格內拖移位置 / 放開在別格→對換
(function(){
  var cv = document.getElementById('prevCv');
  var dragging = false;
  var dragIdx = -1;
  var lastX = 0, lastY = 0;
  var startClientX = 0, startClientY = 0;

  function getSlotIdx(clientX, clientY){
    var rect = cv.getBoundingClientRect();
    var px = (clientX - rect.left) / rect.width;
    var py = (clientY - rect.top) / rect.height;
    var slots = getSlotRatios();
    for(var i=0;i<slots.length;i++){
      var s=slots[i];
      if(px>=s.x && px<=s.x+s.w && py>=s.y && py<=s.y+s.h) return i;
    }
    return -1;
  }

  function clampOff(idx){
    var slots=getSlotRatios();
    var s=slots[idx];
    var W=cv.width,H=cv.height;
    var sw=Math.round(s.w*W),sh=Math.round(s.h*H);
    var img=imgs[idx];if(!img)return;
    var base=Math.max(sw/img.naturalWidth,sh/img.naturalHeight);
    var zoom=cfg[idx].zoom/100;
    var iw=img.naturalWidth*base*zoom,ih=img.naturalHeight*base*zoom;
    var maxOx=(iw-sw)/2+sw*0.2;
    var maxOy=(ih-sh)/2+sh*0.2;
    cfg[idx].ox=Math.max(-maxOx,Math.min(maxOx,cfg[idx].ox));
    cfg[idx].oy=Math.max(-maxOy,Math.min(maxOy,cfg[idx].oy));
  }

  function swapSlots(a,b){
    var ti=imgs[a];imgs[a]=imgs[b];imgs[b]=ti;
    var tc=JSON.parse(JSON.stringify(cfg[a]));
    cfg[a]=JSON.parse(JSON.stringify(cfg[b]));
    cfg[b]=tc;
    cfg[a].ox=0;cfg[a].oy=0;
    cfg[b].ox=0;cfg[b].oy=0;
    rSlotList();_rP();
  }

  cv.style.cursor='grab';

  cv.addEventListener('mousedown',function(e){
    var idx=getSlotIdx(e.clientX,e.clientY);
    if(idx>=0&&imgs[idx]){
      dragging=true;dragIdx=idx;
      lastX=e.clientX;lastY=e.clientY;
      startClientX=e.clientX;startClientY=e.clientY;
      cv.style.cursor='grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove',function(e){
    if(!dragging||dragIdx<0)return;
    var scaleX=cv.width/cv.getBoundingClientRect().width;
    cfg[dragIdx].ox+=(e.clientX-lastX)*scaleX;
    cfg[dragIdx].oy+=(e.clientY-lastY)*scaleX;
    clampOff(dragIdx);
    lastX=e.clientX;lastY=e.clientY;
    _rP();
  });

  window.addEventListener('mouseup',function(e){
    if(!dragging||dragIdx<0){dragging=false;return;}
    // 計算總移動距離
    var totalMove=Math.sqrt(Math.pow(e.clientX-startClientX,2)+Math.pow(e.clientY-startClientY,2));
    // 放開時在哪格
    var upIdx=getSlotIdx(e.clientX,e.clientY);
    // 如果移動超過30px且放在不同格→對換
    if(totalMove>30 && upIdx>=0 && upIdx!==dragIdx){
      swapSlots(dragIdx,upIdx);
    }
    dragging=false;dragIdx=-1;
    cv.style.cursor='grab';
  });

  // touch
  cv.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    var idx=getSlotIdx(t.clientX,t.clientY);
    if(idx>=0&&imgs[idx]){
      dragging=true;dragIdx=idx;
      lastX=t.clientX;lastY=t.clientY;
      startClientX=t.clientX;startClientY=t.clientY;
      e.preventDefault();
    }
  },{passive:false});

  window.addEventListener('touchmove',function(e){
    if(!dragging||dragIdx<0)return;
    var t=e.touches[0];
    var scaleX=cv.width/cv.getBoundingClientRect().width;
    cfg[dragIdx].ox+=(t.clientX-lastX)*scaleX;
    cfg[dragIdx].oy+=(t.clientY-lastY)*scaleX;
    clampOff(dragIdx);
    lastX=t.clientX;lastY=t.clientY;
    _rP();
  },{passive:false});

  window.addEventListener('touchend',function(e){
    if(!dragging||dragIdx<0){dragging=false;return;}
    var t=e.changedTouches[0];
    var totalMove=Math.sqrt(Math.pow(t.clientX-startClientX,2)+Math.pow(t.clientY-startClientY,2));
    var upIdx=getSlotIdx(t.clientX,t.clientY);
    if(totalMove>30&&upIdx>=0&&upIdx!==dragIdx) swapSlots(dragIdx,upIdx);
    dragging=false;dragIdx=-1;
  });
})();

function mkSlr(label,id,min,max,val,unit,onchange){

  sl.oninput=function(){var v=+sl.value; sp.textContent=v+unit; onchange(v);};
  row.appendChild(lbl); row.appendChild(sl); row.appendChild(sp);
  return row;
}

function exId(url){
  var m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)||url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m?m[1]:(/^[a-zA-Z0-9_-]{20,}$/.test(url.trim())?url.trim():null);
}

function loadDriveToSlot(slotIdx,url,inp){

    'https://lh3.googleusercontent.com/d/'+fid,

  ];
  function try_(i){
    if(i>=urls.length){if(msgEl){msgEl.style.color='#c0392b';msgEl.textContent='失敗，請改上傳';}return;}

function _rP(){
  var cv=document.getElementById('prevCv');
  var wrap=document.getElementById('prevWrap');
  var dW=wrap.offsetWidth||400;
  var dH=ratio==='1:1'?dW:Math.round(dW*1.25);
  cv.width=dW; cv.height=dH;
  cv.style.width=dW+'px'; cv.style.height=dH+'px';
  var W=cv.width, H=cv.height;
  var ctx=cv.getContext('2d');
  var BW=Math.round(0.12*W);

  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  // 空格
  var slots=getSlotRatios();
  var L=getL();
  for(var i=0;i<slots.length;i++){
    var r=slots[i];
    if(!imgs[i]){
      var x=Math.round(r.x*W),y=Math.round(r.y*H),w=Math.round(r.w*W),h=Math.round(r.h*H);
      ctx.fillStyle='#efefef'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle='#bbb'; ctx.textAlign='center';
      ctx.font=Math.round(h*0.12)+'px sans-serif';
      ctx.fillText(L[i],x+w/2,y+h/2+4);
    }
  }

  // 圖片
  for(var i=0;i<slots.length;i++){
    var r=slots[i];
    if(imgs[i]){
      var x=Math.round(r.x*W),y=Math.round(r.y*H),w=Math.round(r.w*W),h=Math.round(r.h*H);
      aDraw(ctx,imgs[i],cfg[i],x,y,w,h);
    }
  }

  // 格線（格子間 3px）
  var lines=getLineRatios();
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=3;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    ctx.beginPath();
    ctx.moveTo(Math.max(Math.round(ln.x1*W),BW), Math.round(ln.y1*H));
    ctx.lineTo(Math.round(ln.x2*W), Math.round(ln.y2*H));
    ctx.stroke();
  }

  // 文字帶白底
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,BW,H);

  // 文字帶線
  ctx.strokeStyle='#1a1a1a'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(BW,0); ctx.lineTo(BW,H); ctx.stroke();

  // 文字
  var main=document.getElementById('txM').value||'每個位置，都心有所屬';
  var fs=Math.round(H*0.03);
  ctx.fillStyle='#1a1a1a'; ctx.textAlign='center';
  ctx.font='400 '+fs+'px "Noto Serif TC","Noto Serif",serif';
  vtxtCenter(ctx,main,BW/2,H,fs,fs*1.6);
  // 外框線（最後畫，確保不被蓋住）
  ctx.save();
  ctx.strokeStyle='#1a1a1a';
  ctx.lineWidth=6;
  ctx.strokeRect(1.5,1.5,W-3,H-3);
  // 右邊線單獨補畫確保可見
  ctx.beginPath();
  ctx.moveTo(W-1.5,0);
  ctx.lineTo(W-1.5,H);
  ctx.stroke();
  ctx.restore();
  // 同步所有小縮圖
  for(var _ti=0;_ti<nSlots();_ti++) drawThumb(_ti);
}

function aDraw(ctx,img,s,x,y,w,h){
  if(!img||!w||!h) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.filter='brightness('+s.bright+'%) contrast('+s.contrast+'%)';
  var baseScale=Math.max(w/img.naturalWidth,h/img.naturalHeight);
  var zoom=s.zoom/100;
  var sw=img.naturalWidth*baseScale*zoom;
  var sh=img.naturalHeight*baseScale*zoom;
  ctx.drawImage(img, x+(w-sw)/2+s.ox, y+(h-sh)/2+s.oy, sw, sh);
  ctx.restore();
}

function vtxtCenter(ctx,text,cx,H,fs,lh){
  var chars=Array.from(text);
  var total=chars.length*lh;
  var y=(H-total)/2+fs*0.85;
  for(var i=0;i<chars.length;i++){ctx.fillText(chars[i],cx,y);y+=lh;}
}

function saveToGoogleDrive(name){
  var msg=document.getElementById('saveMsg');

  var W=1080,H=ratio==='1:1'?1080:1350;

  var cv=document.createElement('canvas');cv.width=W;cv.height=H;

    aDraw(ctx,imgs[i],cfg[i],x,y,w,h);
  }
  var lines=getLineRatios();
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    ctx.beginPath();ctx.moveTo(Math.max(Math.round(ln.x1*W),BW),Math.round(ln.y1*H));ctx.lineTo(Math.round(ln.x2*W),Math.round(ln.y2*H));ctx.stroke();
  }
  ctx.fillStyle='#fff';ctx.fillRect(0,0,BW,H);
  ctx.strokeStyle='#1a1a1a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(BW,0);ctx.lineTo(BW,H);ctx.stroke();
  ctx.strokeRect(1.5,1.5,W-3,H-3);ctx.beginPath();ctx.moveTo(W-1.5,0);ctx.lineTo(W-1.5,H);ctx.stroke();
  var fs2=Math.round(H*0.03);
  ctx.fillStyle='#1a1a1a';ctx.textAlign='center';
  ctx.font='400 '+fs2+'px "Noto Serif TC","Noto Serif",serif';
  vtxtCenter(ctx,document.getElementById('txM').value||'每個位置，都心有所屬',BW/2,H,fs2,fs2*1.6);

  cv.toBlob(function(blob){
    // 用 Google Drive API v3 上傳（需要先登入）
    if(!window._gdriveToken){
      // 觸發 Google OAuth
      var client=google.accounts.oauth2.initTokenClient({
        client_id:'999765668036-hgeritojptqndlh2fi2ht005jant5ai5.apps.googleusercontent.com',
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:function(resp){
          if(resp.error){msg.style.color='#c0392b';msg.textContent='登入失敗';return;}
          window._gdriveToken=resp.access_token;
          uploadToDrive(blob,name,msg);
        }
      });
      client.requestAccessToken();
    } else {
      uploadToDrive(blob,name,msg);

function uploadToDrive(blob,name,msg){
  msg.textContent='上傳中…';
  var meta={name:name+'.jpg',mimeType:'image/jpeg'};
  var form=new FormData();
  form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
  form.append('file',blob);
  fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
    method:'POST',
    headers:{Authorization:'Bearer '+window._gdriveToken},
    body:form
  }).then(function(r){return r.json()}).then(function(d){
    if(d.id){msg.style.color='#2e7d32';msg.textContent='✓ 已上傳到 Google Drive：'+name+'.jpg';}
    else{msg.style.color='#c0392b';msg.textContent='上傳失敗';}
  }).catch(function(){msg.style.color='#c0392b';msg.textContent='上傳失敗，請檢查網路';});

// 預覽 canvas：格內拖移位置 / 拖到別格放開→對換
(function(){
  var cv = document.getElementById('prevCv');
  var dragging = false;
  var dragIdx = -1;
  var startX = 0, startY = 0;
  var lastX = 0, lastY = 0;
  var startOx = 0, startOy = 0;
  var SWAP_THRESHOLD = 20; // 超過這個 px 才算真正拖移

  function getSlotIdx(clientX, clientY){
    var rect = cv.getBoundingClientRect();
    var px = (clientX - rect.left) / rect.width;
    var py = (clientY - rect.top) / rect.height;
    var slots = getSlotRatios();
    for(var i=0;i<slots.length;i++){
      var s=slots[i];
      if(px>=s.x && px<=s.x+s.w && py>=s.y && py<=s.y+s.h) return i;
    }
    return -1;
  }

  function clampOffset(idx){
    // 邊界限制：圖片中心不能移出格子
    var slots = getSlotRatios();
    var s = slots[idx];
    var W = cv.width, H = cv.height;
    var sw = Math.round(s.w*W), sh = Math.round(s.h*H);
    var img = imgs[idx];
    if(!img) return;
    var baseScale = Math.max(sw/img.naturalWidth, sh/img.naturalHeight);
    var zoom = cfg[idx].zoom/100;
    var iw = img.naturalWidth*baseScale*zoom;
    var ih = img.naturalHeight*baseScale*zoom;
    var maxOx = iw/2;
    var maxOy = ih/2;
    cfg[idx].ox = Math.max(-maxOx, Math.min(maxOx, cfg[idx].ox));
    cfg[idx].oy = Math.max(-maxOy, Math.min(maxOy, cfg[idx].oy));
  }

  cv.style.cursor='grab';

  cv.addEventListener('mousedown', function(e){
    var idx = getSlotIdx(e.clientX, e.clientY);
    if(idx>=0 && imgs[idx]){
      dragging=true; dragIdx=idx;
      startX=e.clientX; startY=e.clientY;
      lastX=e.clientX; lastY=e.clientY;
      startOx=cfg[idx].ox; startOy=cfg[idx].oy;
      cv.style.cursor='grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', function(e){
    if(!dragging||dragIdx<0) return;
    var cv2=document.getElementById('prevCv');
    var scaleX=cv2.width/cv2.getBoundingClientRect().width;
    var dx=(e.clientX-lastX)*scaleX;
    var dy=(e.clientY-lastY)*scaleX;
    cfg[dragIdx].ox+=dx;
    cfg[dragIdx].oy+=dy;
    clampOffset(dragIdx);
    lastX=e.clientX; lastY=e.clientY;
    _rP();
  });

  window.addEventListener('mouseup', function(e){
    if(!dragging||dragIdx<0){dragging=false;return;}
    var moved=Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY);
    if(moved > SWAP_THRESHOLD){
      // 看放開在哪格
      var targetIdx = getSlotIdx(e.clientX, e.clientY);
      if(targetIdx>=0 && targetIdx!==dragIdx){
        // 對換圖片
        var tmpImg=imgs[dragIdx]; imgs[dragIdx]=imgs[targetIdx]; imgs[targetIdx]=tmpImg;
        var tmpCfg=JSON.parse(JSON.stringify(cfg[dragIdx]));
        cfg[dragIdx]=JSON.parse(JSON.stringify(cfg[targetIdx]));
        cfg[targetIdx]=tmpCfg;
        rSlotList(); _rP();
      }
    }
    dragging=false; dragIdx=-1; cv.style.cursor='grab';
  });

  // touch
  cv.addEventListener('touchstart',function(e){
    var t=e.touches[0];
    var idx=getSlotIdx(t.clientX,t.clientY);
    if(idx>=0&&imgs[idx]){dragging=true;dragIdx=idx;startX=t.clientX;startY=t.clientY;lastX=t.clientX;lastY=t.clientY;startOx=cfg[idx].ox;startOy=cfg[idx].oy;e.preventDefault();}
  },{passive:false});

  window.addEventListener('touchmove',function(e){
    if(!dragging||dragIdx<0) return;
    var t=e.touches[0];
    var cv2=document.getElementById('prevCv');
    var scaleX=cv2.width/cv2.getBoundingClientRect().width;
    cfg[dragIdx].ox+=(t.clientX-lastX)*scaleX;
    cfg[dragIdx].oy+=(t.clientY-lastY)*scaleX;
    clampOffset(dragIdx);
    lastX=t.clientX;lastY=t.clientY;
    _rP();
  },{passive:false});

  window.addEventListener('touchend',function(e){
    if(!dragging||dragIdx<0){dragging=false;return;}
    var t=e.changedTouches[0];
    var moved=Math.abs(t.clientX-startX)+Math.abs(t.clientY-startY);
    if(moved>SWAP_THRESHOLD){
      var targetIdx=getSlotIdx(t.clientX,t.clientY);
      if(targetIdx>=0&&targetIdx!==dragIdx){
        var tmpImg=imgs[dragIdx];imgs[dragIdx]=imgs[targetIdx];imgs[targetIdx]=tmpImg;
        var tmpCfg=JSON.parse(JSON.stringify(cfg[dragIdx]));
        cfg[dragIdx]=JSON.parse(JSON.stringify(cfg[targetIdx]));
        cfg[targetIdx]=tmpCfg;
        rSlotList();_rP();
      }
    }
    dragging=false;dragIdx=-1;
  });
})();

// 建立9格輸入
function init(){
  var g = document.getElementById('gridInputs');
  for(var i=1;i<=9;i++){
    (function(n){
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<div class="cell-num">(' + n + ')</div>' +
        '<div class="preview-box" id="pb'+n+'">' +
          '<img id="pi'+n+'" style="display:none">' +
          '<div class="preview-placeholder" id="pp'+n+'">貼入連結</div>' +
        '</div>' +
        '<input type="text" id="url'+n+'" placeholder="Drive 連結或圖片網址">';
      g.appendChild(cell);
      document.getElementById('url'+n).addEventListener('input', function(){
        updatePreview(n, this.value.trim());
      });
    })(i);
  }
}

function convertDriveUrl(url){
  var m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m) return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w800';
  return url;
}

function updatePreview(n, url){
  if(!url) return;
  var inp = document.getElementById('url'+n);
  var converted = convertDriveUrl(url);
  if(converted !== url) inp.classList.add('converted');
  else inp.classList.remove('converted');
  var img = document.getElementById('pi'+n);
  var ph = document.getElementById('pp'+n);
  img.src = converted;
  img.style.display = 'block';
  ph.style.display = 'none';
  img.onerror = function(){ img.style.display='none'; ph.style.display='flex'; ph.textContent='載入失敗'; };
}

function generate(){
  var series = document.getElementById('seriesTitle').value || 'iBao';
  var cells = '';
  for(var i=1;i<=9;i++){
    var raw = document.getElementById('url'+i).value.trim();
    var url = raw ? convertDriveUrl(raw) : '';
    var imgHtml = url ?
      '<img src="'+url+'" alt="('+i+')" loading="lazy" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;">' :
      '';
    cells += '<div style="background:#fff;">' +
      '<div style="width:100%;position:relative;padding-bottom:100%;overflow:hidden;background:#f0f0ee;">' +
        imgHtml +
      '</div>' +
      '<div style="text-align:center;font-size:11px;color:#555;padding:5px 0 6px;font-family:Arial,sans-serif;letter-spacing:1px;">('+i+')</div>' +
    '</div>';
  }

  var html = '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #eee;background:#fff;max-width:600px;margin:0 auto;">' +
    '<span style="font-size:12px;font-weight:600;letter-spacing:2px;color:#1a1a1a;font-family:Arial,sans-serif;">ibao</span>' +
    '<div style="width:1px;height:14px;background:#ddd;"></div>' +
    '<span style="font-size:9px;letter-spacing:1px;color:#555;font-family:Arial,sans-serif;text-transform:uppercase;padding-top:4px;">Bag Pillow &amp; Bag Organizer</span>' +
    '<span style="margin-left:auto;font-size:9px;letter-spacing:2px;color:#333;font-family:Arial,sans-serif;text-transform:uppercase;padding-top:4px;">'+series+'</span>' +
  '</div>' +
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:600px;margin:0 auto;background:#eee;">' +
    cells +
  '</div>';

  document.getElementById('outputCode').textContent = html;
  document.getElementById('previewResult').innerHTML = html;
}

function copyCode(){
  var code = document.getElementById('outputCode').textContent;
  navigator.clipboard.writeText(code).then(function(){
    alert('已複製！');
  });
}

function saveHtmlFile(){
  var name = document.getElementById('g9FileName').value.trim();
  if(!name){ alert('請先填寫檔名'); document.getElementById('g9FileName').focus(); return; }
  var code = document.getElementById('outputCode').textContent;
  if(!code || code === '點擊「產生 HTML」後顯示'){ alert('請先點擊「產生 HTML」'); return; }
  // 包成完整 HTML 頁面
  var fullHtml = '<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>'+name+'</title></head><body>'+code+'</body></html>';
  var blob = new Blob([fullHtml], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name+'.html';
  a.click();
}
